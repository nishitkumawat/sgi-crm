{% extends 'sgierp/base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}
{% block breadcrumb %}
<a href="{% url 'sgierp:settings' %}" class="breadcrumb-parent">Settings</a>
<span class="breadcrumb-sep"><i class="bi bi-chevron-right"></i></span>
<a href="{% url 'sgierp:settings_assignees' %}" class="breadcrumb-parent">Assignees</a>
<span class="breadcrumb-sep"><i class="bi bi-chevron-right"></i></span>
<span class="page-title">{{ page_title }}</span>
{% endblock %}

{% block content %}
<div style="max-width:480px;">
<form method="POST">
{% csrf_token %}
<div class="sgi-card">
  <div class="sgi-card-header">
    <div class="sgi-card-title"><div class="card-icon"><i class="bi bi-person-badge"></i></div> Assignee Details</div>
  </div>
  <div class="sgi-card-body">
    <div class="sgi-form-group">
      <label class="sgi-label" for="name">Name <span class="required">*</span></label>
      <input type="text" class="sgi-input" id="name" name="name"
        value="{{ assignee.name|default:'' }}" required placeholder="Worker / staff name">
    </div>
    <div class="form-grid">
      <div class="sgi-form-group">
        <label class="sgi-label" for="department">Department</label>
        <input type="text" class="sgi-input" id="department" name="department"
          value="{{ assignee.department|default:'' }}" placeholder="Department">
      </div>
      <div class="sgi-form-group">
        <label class="sgi-label" for="phone">Phone</label>
        <input type="text" class="sgi-input" id="phone" name="phone"
          value="{{ assignee.phone|default:'' }}" placeholder="Optional">
      </div>
    </div>
    <div class="sgi-form-group">
      <label class="sgi-check-label">
        <input type="checkbox" name="is_active"
          {% if assignee.is_active != False %}checked{% endif %}>
        Assignee is Active
      </label>
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;">
      <button type="submit" class="btn-sgi btn-sgi-primary">
        <i class="bi bi-check-lg"></i> Save Assignee
      </button>
      <a href="{% url 'sgierp:settings_assignees' %}" class="btn-sgi btn-sgi-outline">Cancel</a>
    </div>
  </div>
</div>
</form>
</div>
{% endblock %}

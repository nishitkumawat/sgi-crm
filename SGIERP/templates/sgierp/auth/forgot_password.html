{% extends 'sgierp/base.html' %}
{% load static %}
{% block auth_content %}
<div class="sgi-auth-body">
  <div class="sgi-auth-card">
    <div class="sgi-auth-header">
      <img src="{% static 'sgierp/images/logo.png' %}" alt="Shree Gayatri Industries" class="sgi-auth-logo-img">
      <h1>Forgot Password</h1>
      <p>Enter your username to receive an OTP</p>
    </div>
    <div class="sgi-auth-body-inner">
      {% if messages %}{% for message in messages %}
      <div class="sgi-alert sgi-alert-info" style="margin-bottom:16px;">
        <i class="bi bi-info-circle-fill"></i> {{ message }}
      </div>
      {% endfor %}{% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="sgi-form-group">
          <label class="sgi-label">Username <span class="required">*</span></label>
          <div class="sgi-input-group">
            <span class="sgi-input-icon"><i class="bi bi-person"></i></span>
            <input type="text" class="sgi-input" name="username" placeholder="Your ERP username" required autofocus>
          </div>
        </div>
        <button type="submit" class="btn-sgi btn-sgi-primary" style="width:100%;justify-content:center;padding:11px;">
          <i class="bi bi-send"></i> Send OTP
        </button>
        <div class="sgi-auth-links"><a href="{% url 'sgierp:login' %}">← Back to Login</a></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

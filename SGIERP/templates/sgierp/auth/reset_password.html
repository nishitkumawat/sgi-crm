{% extends 'sgierp/base.html' %}
{% load static %}
{% block auth_content %}
<div class="sgi-auth-body">
  <div class="sgi-auth-card">
    <div class="sgi-auth-header">
      <img src="{% static 'sgierp/images/logo.png' %}" alt="Shree Gayatri Industries" class="sgi-auth-logo-img">
      <h1>Set New Password</h1>
      <p>Enter your new password</p>
    </div>
    <div class="sgi-auth-body-inner">
      {% if messages %}{% for message in messages %}
      <div class="sgi-alert {% if message.tags == 'error' %}sgi-alert-error{% else %}sgi-alert-info{% endif %}" style="margin-bottom:16px;">
        <i class="bi bi-exclamation-triangle-fill"></i> {{ message }}
      </div>
      {% endfor %}{% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="sgi-form-group">
          <label class="sgi-label">New Password <span class="required">*</span></label>
          <div class="sgi-input-group">
            <span class="sgi-input-icon"><i class="bi bi-lock"></i></span>
            <input type="password" class="sgi-input" id="newPassword" name="password" placeholder="Min 8 characters" required>
            <button type="button" class="sgi-input-icon" data-show-password="newPassword" style="border-left:1px solid var(--sgi-border);cursor:pointer;background:var(--sgi-bg);">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="sgi-form-group">
          <label class="sgi-label">Confirm Password <span class="required">*</span></label>
          <input type="password" class="sgi-input" name="confirm_password" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn-sgi btn-sgi-primary" style="width:100%;justify-content:center;padding:11px;">
          <i class="bi bi-check2"></i> Reset Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
